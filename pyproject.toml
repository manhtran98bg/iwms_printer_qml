[project]
name = "rostek-iwms-printer-pyside6-qml"
version = "0.1.0"
description = "PySide6/QML rewrite skeleton for the Rostek iWMS printer utility"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pywin32>=306; platform_system == 'Windows'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
